# Local, private SearXNG used by the workers to find company websites.
# The secret key comes from the SEARXNG_SECRET env var (see .env).
use_default_settings: true

general:
  instance_name: "prospect-search"

server:
  limiter: false          # only reachable from the docker network / localhost
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  default_lang: "fr-FR"
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
