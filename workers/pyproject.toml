[project]
name = "prospect-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "selectolax>=0.3.21",
  "python-dotenv>=1.0",
]

[project.scripts]
prospect = "prospect_workers.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospect_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
