name: signal-prospection

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospect}
      POSTGRES_DB: prospect
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect"]
      interval: 5s
      retries: 10

  # private meta search engine, used to find company websites without paid APIs
  searxng:
    image: searxng/searxng:2026.10.13-22c64b8d3
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # daily pipeline: collect -> enrich -> discover -> audit -> contacts -> score
  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prospect:${POSTGRES_PASSWORD:-prospect}@db:5432/prospect
      SEARXNG_URL: http://searxng:8080
      TZ: Europe/Paris
    command: ["prospect", "daemon", "--at", "${RUN_AT:-07:00}"]
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started

volumes:
  pgdata:
